name: Compiling

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Compile
      uses: TheWinABagel/compilation@v1
      
    - name: Archive Artifacts
      uses: actions/upload-artifact@v4.6.2
      with:
        name: Artifacts
        path: ./build/libs

    - name: Publish to GitHub Packages
      run: ./gradlew publish
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
